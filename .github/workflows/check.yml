name: Source and behavior checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 -m pip install -r integrations/voice/requirements-test.txt
      - run: ./tools/check.sh
      - run: python3 tools/check_release.py
      - run: python3 -m unittest discover -s integrations/voice -p 'test_*.py'
      - run: npm ci && npm test
        working-directory: integrations/media
