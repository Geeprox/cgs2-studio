<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGS2 媒体设置</title><link rel="stylesheet" href="/settings.css"><main><h1>CGS2 媒体设置</h1><label>管理密钥 <input id="token" type="password" autocomplete="off"></label><button id="connect">连接</button><p id="status" role="status"></p><section id="settings" hidden><label>媒体来源 <select id="source"><option value="nas">NAS 文件夹 / 文件</option><option value="photos">Synology Photos 共享相册</option></select></label><label><input id="enabled" type="checkbox">启用媒体</label><label>轮播间隔（秒）<input id="interval" type="number" min="3" max="60" value="10"></label><div id="nas"><p id="selection">未选择照片文件夹</p><button id="folder">选择照片文件夹</button><button id="video">添加视频</button><button id="audio">添加音乐</button><ul id="files"></ul></div><label id="photos" hidden>相册共享链接 <input id="album" type="url" placeholder="留空保留现有相册"></label><label><input id="recursive" type="checkbox" checked>包含子文件夹照片</label><button id="save">保存</button><dialog id="browser"><h2>选择媒体</h2><p id="location"></p><div id="entries"></div><button id="up">上一级</button><button id="more">更多</button><button id="choose">选择当前文件夹</button><button id="cancel">取消</button></dialog></section></main><script type="module" src="/settings.js"></script></html>
